<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Google Drive</title>
        <link id="favicon" rel="icon" href="/assets/favicon.png" />
        <style>
            :root {
                --bg-dark: #202225;
                --bg-sidebar: #2f3136;
                --bg-chat: #36393f;
                --text-main: #dcddde;
                --accent: #5865f2;
            }
            body {
                margin: 0;
                display: flex;
                height: 100vh;
                font-family: sans-serif;
                background: var(--bg-dark);
                color: var(--text-main);
                overflow: hidden;
            }

            #messages li.grouped {
                margin-top: -10px;
                margin-bottom: 15px;
                padding-left: 0px;
                list-style: none;
            }

            #full-screen-img {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                object-fit: cover;
                z-index: 9999;
                display: none;
            }

            #server-sidebar {
                width: 72px;
                min-width: 72px;
                background: var(--bg-dark);
                display: flex;
                flex-direction: column;
                align-items: center;
                padding-top: 12px;
                gap: 8px;
                border-right: 1px solid #222;
            }
            .server-icon {
                width: 48px;
                height: 48px;
                background: var(--bg-sidebar);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: 0.2s;
                font-weight: bold;
            }
            .server-icon:hover,
            .server-icon.active {
                border-radius: 30%;
                background: var(--accent);
                color: white;
            }

            #channel-sidebar {
                width: 240px;
                background: var(--bg-sidebar);
                padding: 20px;
                display: flex;
                flex-direction: column;
            }

            #chat-container {
                flex-grow: 1;
                min-width: 0;
                background: var(--bg-chat);
                display: flex;
                flex-direction: column;
                overflow-wrap: break-word;
            }
            #messages {
                flex-grow: 1;
                overflow-y: auto;
                padding: 20px;
                list-style: none;
                margin: 0;
            }
            #messages li {
                margin-bottom: 15px;
                overflow-wrap: break-word;
                word-break: break-word;
            }
            .msg-user {
                font-weight: bold;
                color: white;
                margin-right: 8px;
            }
            .msg-time {
                font-size: 0.75rem;
                color: #72767d;
            }

            #input-area {
                padding: 20px;
            }
            #msg-input {
                width: 100%;
                padding: 12px;
                border-radius: 8px;
                border: none;
                background: #40444b;
                color: white;
                box-sizing: border-box;
            }

            #auth-overlay {
                position: fixed;
                inset: 0;
                background: #202225;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
            }
            .auth-card {
                background: #36393f;
                padding: 30px;
                border-radius: 8px;
                width: 300px;
                display: flex;
                flex-direction: column;
                gap: 15px;
            }
            input[type="email"],
            input[type="password"] {
                padding: 10px;
                border-radius: 4px;
                border: none;
                background: #202225;
                color: white;
            }
            button {
                padding: 10px;
                background: var(--accent);
                border: none;
                color: white;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }

            hr {
                border: 0;
                border-top: 1px solid #444;
                width: 100%;
                margin: 10px 0;
            }
            .bg-image {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                object-fit: cover;
                z-index: -1;
            }
            .member-item {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 14px;
                padding: 5px 0;
            }
            .status-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                flex-shrink: 0;
            }
            .online {
                background: #3ba55d;
            }
            .offline {
                background: #747f8d;
            }
        </style>
    </head>
    <body>
        <img
            id="full-screen-img"
            src="/assets/drive.png"
            alt="Full Screen Image"
        />

        <div id="auth-overlay">
            <div class="auth-card">
                <h2 style="margin: 0">Welcome!</h2>
                <input type="email" id="email" placeholder="Email" />
                <input type="password" id="password" placeholder="Password" />
                <button onclick="handleAuth('login')">Login</button>
                <button
                    onclick="handleAuth('register')"
                    style="background: #444"
                >
                    Register
                </button>
            </div>
        </div>

        <div id="server-sidebar">
            <div
                class="server-icon"
                onclick="createServer()"
                title="Create Server"
            >
                +
            </div>
            <div class="server-icon" onclick="joinServer()" title="Join Server">
                🔍
            </div>
            <hr />
            <div id="server-list"></div>
        </div>

        <div id="channel-sidebar">
            <h3 id="current-server-name">Select a Server</h3>
            <p
                id="invite-display"
                style="font-size: 12px; color: #aaa; margin-top: -10px"
            ></p>

            <div
                style="
                    margin-top: 10px;
                    display: flex;
                    flex-direction: column;
                    gap: 5px;
                "
            >
                <button
                    onclick="changeUsername()"
                    style="background: #4f545c; font-size: 12px"
                >
                    Edit Username
                </button>
                <button
                    onclick="changeEmail()"
                    style="background: #4f545c; font-size: 12px"
                >
                    Edit Email
                </button>
            </div>

            <div style="margin-top: 10px">
                <button
                    id="delete-btn"
                    onclick="deleteCurrentServer()"
                    style="
                        display: none;
                        background: #f04747;
                        width: 100%;
                        margin-bottom: 5px;
                    "
                >
                    Delete Server
                </button>
                <button
                    id="leave-btn"
                    onclick="leaveCurrentServer()"
                    style="display: none; background: #f04747; width: 100%"
                >
                    Leave Server
                </button>
            </div>

            <div id="member-list-container" style="margin-top: 20px">
                <h4
                    style="
                        font-size: 11px;
                        color: #8e9297;
                        text-transform: uppercase;
                        letter-spacing: 0.5px;
                    "
                >
                    Members
                </h4>
                <div
                    id="member-list"
                    style="display: flex; flex-direction: column; gap: 4px"
                ></div>
            </div>

            <button
                onclick="logout()"
                style="margin-top: auto; background: #444"
            >
                Logout
            </button>
        </div>

        <div id="chat-container">
            <ul id="messages"></ul>
            <form id="input-area" style="display: flex; gap: 10px">
                <input
                    id="msg-input"
                    placeholder="select a server to chat..."
                    disabled
                />
                <button
                    type="button"
                    onclick="sendImageUrl()"
                    style="background: #4f545c; white-space: nowrap"
                >
                    📷
                </button>
            </form>
        </div>

        <img
            src="https://i.postimg.cc/bNvZGqhm/Screenshot-2026-01-24-153621.png"
            class="bg-image"
            id="bg-image"
        />

        <script>
            window.handleAuth = (type) => {
                if (window._handleAuth) window._handleAuth(type);
                else console.log("Auth system initializing...");
            };
        </script>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
            import {
                getFirestore,
                collection,
                addDoc,
                query,
                where,
                orderBy,
                onSnapshot,
                serverTimestamp,
                getDocs,
                deleteDoc,
                doc,
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
            import {
                getAuth,
                createUserWithEmailAndPassword,
                signInWithEmailAndPassword,
                onAuthStateChanged,
                signOut,
                updateProfile,
                updateEmail,
                EmailAuthProvider,
                reauthenticateWithCredential,
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
            import {
                getDatabase,
                ref,
                onValue,
                set,
                onDisconnect,
                serverTimestamp as rtdbTimestamp,
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

            const firebaseConfig = {
                apiKey: "AIzaSyCRB2celD-ShWGOIXm2fpYLQXz36IB5vfE",
                authDomain: "schoolchat-e20ed.firebaseapp.com",
                projectId: "schoolchat-e20ed",
                storageBucket: "schoolchat-e20ed.firebasestorage.app",
                messagingSenderId: "344918432102",
                appId: "1:344918432102:web:d764d62de4c28e89dc10a7",
                measurementId: "G-YWKTE0ESHE",
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            const rtdb = getDatabase(app);

            let currentUser = null;
            let currentServerId = null;
            let unsubMessages = null;
            let unsubMembers = null;

            // Shortcut
            document.addEventListener("keydown", (e) => {
                if (e.ctrlKey && e.key === "k") {
                    e.preventDefault();
                    const drive = document.getElementById("full-screen-img");
                    drive.style.display =
                        drive.style.display === "none" ||
                        drive.style.display === ""
                            ? "block"
                            : "none";
                }
            });

            window._handleAuth = (type) => {
                const email = document.getElementById("email").value;
                const pass = document.getElementById("password").value;
                const authFunc =
                    type === "register"
                        ? createUserWithEmailAndPassword
                        : signInWithEmailAndPassword;
                authFunc(auth, email, pass).catch((err) => alert(err.message));
            };

            window.logout = () => signOut(auth).then(() => location.reload());

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    document.getElementById("auth-overlay").style.display =
                        "none";
                    setupPresence(user);
                    loadUserServers();
                } else {
                    document.getElementById("auth-overlay").style.display =
                        "flex";
                }
            });

            function setupPresence(user) {
                const userStatusRef = ref(rtdb, "/status/" + user.uid);
                const name = user.displayName || user.email.split("@")[0];

                const statusInfo = {
                    state: "online",
                    last_changed: rtdbTimestamp(),
                    userName: name,
                };

                onValue(ref(rtdb, ".info/connected"), (snapshot) => {
                    if (snapshot.val() === false) return;
                    onDisconnect(userStatusRef)
                        .set({ ...statusInfo, state: "offline" })
                        .then(() => {
                            set(userStatusRef, statusInfo);
                        });
                });
            }

            window.createServer = async () => {
                const name = prompt("Enter Server Name:");
                if (!name) return;
                const code = Math.random()
                    .toString(36)
                    .substring(2, 7)
                    .toUpperCase();
                const serverDoc = await addDoc(collection(db, "servers"), {
                    name,
                    inviteCode: code,
                    owner: currentUser.uid,
                });
                await addDoc(collection(db, "members"), {
                    serverId: serverDoc.id,
                    userId: currentUser.uid,
                    serverName: name,
                    userName:
                        currentUser.displayName ||
                        currentUser.email.split("@")[0],
                });
            };

            window.joinServer = async () => {
                const code = prompt("Enter Invite Code:");
                if (!code) return;
                const q = query(
                    collection(db, "servers"),
                    where("inviteCode", "==", code.toUpperCase()),
                );
                const snap = await getDocs(q);
                if (!snap.empty) {
                    const server = snap.docs[0];
                    await addDoc(collection(db, "members"), {
                        serverId: server.id,
                        userId: currentUser.uid,
                        serverName: server.data().name,
                        userName:
                            currentUser.displayName ||
                            currentUser.email.split("@")[0],
                    });
                } else alert("Invalid Code");
            };

            function loadUserServers() {
                const q = query(
                    collection(db, "members"),
                    where("userId", "==", currentUser.uid),
                );
                onSnapshot(q, (snap) => {
                    const list = document.getElementById("server-list");
                    list.innerHTML = "";
                    snap.forEach((doc) => {
                        const data = doc.data();
                        const el = document.createElement("div");
                        el.className =
                            "server-icon" +
                            (currentServerId === data.serverId
                                ? " active"
                                : "");
                        el.innerText = data.serverName[0].toUpperCase();
                        el.onclick = () =>
                            selectServer(data.serverId, data.serverName);
                        list.appendChild(el);
                    });
                });
            }

            async function selectServer(id, name) {
                currentServerId = id;
                document.getElementById("current-server-name").innerText = name;
                document.getElementById("msg-input").disabled = false;
                document.getElementById("msg-input").placeholder =
                    `Message ${name}`;

                const q_server = await getDocs(
                    query(collection(db, "servers")),
                );
                const serverInfo = q_server.docs.find((d) => d.id === id);
                if (serverInfo) {
                    const data = serverInfo.data();
                    document.getElementById("invite-display").innerText =
                        `INVITE CODE: ${data.inviteCode}`;
                    document.getElementById("delete-btn").style.display =
                        data.owner === currentUser.uid ? "block" : "none";
                    document.getElementById("leave-btn").style.display =
                        data.owner === currentUser.uid ? "none" : "block";
                }

                loadMembers(id);
                loadMessages(id);
            }

            function loadMembers(serverId) {
                if (unsubMembers) unsubMembers();
                const memberQuery = query(
                    collection(db, "members"),
                    where("serverId", "==", serverId),
                );

                unsubMembers = onSnapshot(memberQuery, (snap) => {
                    const memberList = document.getElementById("member-list");
                    memberList.innerHTML = "";
                    snap.forEach((mDoc) => {
                        const mData = mDoc.data();
                        const uid = mData.userId;

                        const item = document.createElement("div");
                        item.className = "member-item";
                        item.id = `member-row-${uid}`;
                        item.innerHTML = `
                            <div class="status-dot offline" id="dot-${uid}"></div>
                            <span id="name-${uid}">${mData.userName || "Loading..."}</span>
                        `;
                        memberList.appendChild(item);

                        // Sync with RTDB for real-time name/status
                        onValue(ref(rtdb, "/status/" + uid), (statusSnap) => {
                            const val = statusSnap.val();
                            const dot = document.getElementById(`dot-${uid}`);
                            const nameSpan = document.getElementById(
                                `name-${uid}`,
                            );
                            if (val && dot && nameSpan) {
                                dot.className = `status-dot ${val.state}`;
                                nameSpan.innerText =
                                    val.userName || mData.userName;
                            }
                        });
                    });
                });
            }

            function loadMessages(serverId) {
                if (unsubMessages) unsubMessages();
                const q = query(
                    collection(db, "messages"),
                    where("serverId", "==", serverId),
                    orderBy("createdAt", "asc"),
                );
                unsubMessages = onSnapshot(q, (snap) => {
                    const list = document.getElementById("messages");
                    list.innerHTML = "";
                    let lastMsg = null;
                    snap.forEach((doc) => {
                        const data = doc.data();
                        const createdAt = data.createdAt?.toDate();
                        const time =
                            createdAt?.toLocaleTimeString([], {
                                hour: "2-digit",
                                minute: "2-digit",
                            }) || "...";
                        const li = document.createElement("li");

                        let isGrouped = false;
                        if (
                            lastMsg &&
                            lastMsg.user === data.user &&
                            createdAt &&
                            lastMsg.createdAt?.toDate() &&
                            createdAt - lastMsg.createdAt.toDate() < 300000
                        ) {
                            isGrouped = true;
                        }

                        const isImg = (url) =>
                            /\.(jpeg|jpg|gif|png|webp)/i.test(url) ||
                            url.startsWith("data:image");
                        let content = isImg(data.text)
                            ? `<img src="${data.text}" style="max-width: 100%; border-radius: 8px; margin-top: 5px; display: block;">`
                            : data.text;

                        if (isGrouped) {
                            li.className = "grouped";
                            li.innerHTML = `<div>${content}</div>`;
                        } else {
                            li.innerHTML = `<span class="msg-user">${data.user}</span><span class="msg-time">${time}</span><br>${content}`;
                        }
                        list.appendChild(li);
                        lastMsg = data;
                    });
                    list.scrollTop = list.scrollHeight;
                });
            }

            document.getElementById("input-area").onsubmit = async (e) => {
                e.preventDefault();
                const text = document.getElementById("msg-input").value;
                if (!text || !currentServerId) return;
                await addDoc(collection(db, "messages"), {
                    text,
                    user:
                        currentUser.displayName ||
                        currentUser.email.split("@")[0],
                    serverId: currentServerId,
                    createdAt: serverTimestamp(),
                });
                document.getElementById("msg-input").value = "";
            };

            window.changeUsername = async () => {
                const n = prompt("New Username:");
                if (!n) return;
                await updateProfile(auth.currentUser, { displayName: n });
                await set(
                    ref(rtdb, "/status/" + auth.currentUser.uid + "/userName"),
                    n,
                );
                alert("Updated!");
            };
        </script>
    </body>
</html>
