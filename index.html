<!doctype html>
<html>
  <head>
    <title>Real-Time Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        margin: 0;
        padding-bottom: 3rem;
        background: #f4f4f9;
      }

      #messages {
        list-style-type: none;
        margin: 0;
        padding: 1rem;
        display: flex;
        flex-direction: column;
      }
      #messages li {
        padding: 0.5rem 1rem;
        margin-bottom: 10px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        max-width: 80%;
      }

      .announcement {
        background: none !important;
        box-shadow: none !important;
        font-style: italic;
        color: #888;
        align-self: center;
        font-size: 0.9rem;
      }
      .time {
        font-size: 0.7rem;
        color: #999;
        margin-left: 8px;
      }
      .username {
        font-weight: bold;
        color: #2e7d32;
      }

      #form {
        background: #fff;
        padding: 0.5rem;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        border-top: 1px solid #ddd;
      }
      #input {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        background: #eee;
        margin: 0.25rem;
      }
      #input:focus {
        outline: none;
      }
      #form button {
        background: #2e7d32;
        border: none;
        padding: 0 1.5rem;
        margin: 0.25rem;
        border-radius: 3px;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <ul id="messages"></ul>

    <form id="form">
      <input
        id="input"
        autocomplete="off"
        placeholder="Type a message..."
      /><button>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      // Ask for name
      const userName = prompt("Enter your username:") || "Anonymous";
      socket.emit("user joined", userName);

      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const messages = document.getElementById("messages");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (input.value) {
          socket.emit("chat message", { user: userName, text: input.value });
          input.value = "";
        }
      });

      // Listen for regular messages
      socket.on("chat message", (data) => {
        const item = document.createElement("li");
        item.innerHTML = `<span class="username">${data.user}</span><span class="time">${data.time}</span><br>${data.text}`;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      });

      // Listen for announcements (join/leave)
      socket.on("announcement", (text) => {
        const item = document.createElement("li");
        item.className = "announcement";
        item.textContent = text;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      });

      // Add this inside your <script> tag in index.html

      // Listen for the history dump when you first connect
      socket.on("load history", (history) => {
        messages.innerHTML = ""; // Clear current view
        history.forEach((data) => {
          const item = document.createElement("li");
          item.innerHTML = `<span class="username">${data.user}</span><span class="time">${data.time}</span><br>${data.text}`;
          messages.appendChild(item);
        });
        window.scrollTo(0, document.body.scrollHeight);
      });
    </script>
  </body>
</html>
