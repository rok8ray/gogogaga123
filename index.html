<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Google Drive</title>
        <link id="favicon" rel="icon" href="/assets/favicon.png" />
        <style>
            :root {
                --bg-dark: #202225;
                --bg-sidebar: #2f3136;
                --bg-chat: #36393f;
                --text-main: #dcddde;
                --accent: #5865f2;
                --danger: #ed4245;
            }
            body {
                margin: 0;
                display: flex;
                height: 100vh;
                font-family: sans-serif;
                background: var(--bg-dark);
                color: var(--text-main);
                overflow: hidden;
            }

            /* Server List (Far Left) */
            #server-sidebar {
                width: 72px;
                min-width: 72px;
                background: var(--bg-dark);
                display: flex;
                flex-direction: column;
                align-items: center;
                padding-top: 12px;
                gap: 8px;
                border-right: 1px solid #222;
            }
            .server-icon {
                width: 48px;
                height: 48px;
                background: var(--bg-sidebar);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: 0.2s;
                font-weight: bold;
                color: var(--text-main);
                text-decoration: none;
            }
            .server-icon:hover,
            .server-icon.active {
                border-radius: 30%;
                background: var(--accent);
                color: white;
            }

            /* Channel/Settings Sidebar */
            /* Update the Channel/Admin Sidebar */
            #channel-sidebar {
                width: 240px;
                min-width: 240px; /* Forces it to stay this wide */
                flex-shrink: 0; /* Prevents flexbox from squishing it */
                background: var(--bg-sidebar);
                padding: 20px;
                display: flex;
                flex-direction: column;
                overflow-y: auto; /* Adds a scrollbar if the blacklist gets too long */
            }

            #user-info {
                padding: 10px;
                background: rgba(0, 0, 0, 0.2);
                border-radius: 5px;
                margin-bottom: 15px;
            }

            /* Chat Area */
            #chat-container {
                flex-grow: 1;
                min-width: 0;
                background: var(--bg-chat);
                display: flex;
                flex-direction: column;
            }
            #messages {
                flex-grow: 1;
                overflow-y: auto;
                padding: 20px;
                list-style: none;
                margin: 0;
            }
            #messages li {
                margin-bottom: 15px;
            }
            #messages li.grouped {
                margin-top: -10px;
                padding-left: 0;
            }
            .msg-user {
                font-weight: bold;
                color: white;
                margin-right: 8px;
            }
            .msg-time {
                font-size: 0.75rem;
                color: #72767d;
            }
            /* 1. Hide the delete button by default */
            .delete-btn {
                opacity: 0;
                transition: opacity 0.2s ease;
                cursor: pointer;
                color: var(--danger);
                margin-left: 8px;
                font-size: 10px;
                font-weight: bold;
                background: rgba(0, 0, 0, 0.1);
                padding: 2px 5px;
                border-radius: 4px;
            }

            /* 2. Show the button when the parent <li> is hovered */
            #messages li:hover .delete-btn {
                opacity: 1;
            }

            /* 3. Also show it when a grouped message is hovered */
            .grouped:hover .delete-btn {
                opacity: 1;
            }

            /* Inputs/Buttons */
            #input-area {
                padding: 20px;
                display: flex;
                gap: 10px;
            }
            #msg-input {
                flex-grow: 1;
                padding: 12px;
                border-radius: 8px;
                border: none;
                background: #40444b;
                color: white;
            }
            button {
                padding: 10px;
                background: var(--accent);
                border: none;
                color: white;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }
            .btn-danger {
                background: var(--danger);
                margin-top: 5px;
            }

            #auth-overlay {
                position: fixed;
                inset: 0;
                background: #202225;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
            }
            .auth-card {
                background: #36393f;
                padding: 30px;
                border-radius: 8px;
                width: 300px;
                display: flex;
                flex-direction: column;
                gap: 15px;
            }
            input[type="email"],
            input[type="password"] {
                padding: 10px;
                border-radius: 4px;
                border: none;
                background: #202225;
                color: white;
            }
            #member-sidebar {
                width: 240px;
                min-width: 240px; /* Forces it to stay this wide */
                flex-shrink: 0; /* Prevents flexbox from squishing it */
                background: var(--bg-sidebar);
                border-left: 1px solid #222;
                display: flex;
                flex-direction: column;
                padding: 20px;
            }

            /* Optional: Toggle class for mobile/small screens */
            .hidden {
                display: none !important;
            }

            a:visited {
                color: #507fa7;
            }
            a {
                color: #507fa7;
            }
            #mention-suggestions {
                position: absolute;
                bottom: 70px; /* Position it above the input area */
                left: 20px;
                background: #2f3136;
                border: 1px solid #222;
                border-radius: 4px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
                z-index: 100;
                max-height: 150px;
                overflow-y: auto;
                width: 200px;
            }
            .mention-item {
                padding: 8px 12px;
                cursor: pointer;
                font-size: 13px;
                color: #dcddde;
            }
            .mention-item:hover {
                background: #5865f2;
                color: white;
            }
        </style>
    </head>
    <body>
        <div id="auth-overlay">
            <div class="auth-card">
                <h2 style="margin: 0">Welcome!</h2>
                <input type="email" id="email" placeholder="Email" />
                <input type="password" id="password" placeholder="Password" />
                <button onclick="handleAuth('login')">Login</button>
                <button
                    onclick="handleAuth('register')"
                    style="background: #444"
                >
                    Register
                </button>
            </div>
        </div>

        <div id="server-sidebar">
            <div
                class="server-icon"
                onclick="createServer()"
                title="Create Server"
            >
                +
            </div>
            <div class="server-icon" onclick="joinServer()" title="Join Server">
                🔍
            </div>
            <hr style="width: 40px; border: 1px solid #444; margin: 5px 0" />
            <div id="server-list"></div>
        </div>

        <div id="channel-sidebar">
            <h3 id="current-server-name">Select a Server</h3>
            <p
                id="invite-display"
                style="font-size: 11px; color: #aaa; margin-top: -10px"
            ></p>

            <div id="user-info">
                <div style="font-size: 12px; color: #aaa">Logged in as:</div>
                <div
                    id="display-name-text"
                    style="font-weight: bold; color: #fff"
                >
                    ...
                </div>
            </div>
            <img
                id="a"
                style="
                    display: none;
                    top: 0;
                    left: 0;
                    width: 100vw;
                    height: 100vh;
                    object-fit: cover;
                    position: fixed;
                    z-index: 100000000000000000000000000000000000000000000;
                "
                src="/assets/drive.png"
            />
            <div style="display: flex; flex-direction: column; gap: 5px">
                <button
                    onclick="changeUsername()"
                    style="background: #4f545c; font-size: 12px"
                >
                    Edit Username
                </button>
                <button
                    id="edit-server-btn"
                    onclick="editServerIcon()"
                    style="display: block; background: #4f545c; margin-top: 5px"
                >
                    Edit Server Icon
                </button>
                <button
                    id="leave-btn"
                    onclick="leaveServer()"
                    class="btn-danger"
                    style="display: none"
                >
                    Leave Server
                </button>
                <button
                    id="delete-btn"
                    onclick="deleteServer()"
                    class="btn-danger"
                    style="display: none; background: #a12d2f"
                >
                    Delete Server
                </button>
            </div>

            <div
                id="admin-panel"
                style="
                    display: none;
                    margin-top: 20px;
                    border-top: 1px solid #444;
                    padding-top: 10px;
                "
            >
                <h4 style="margin: 0 0 10px 0; font-size: 14px; color: #ed4245">
                    Server Blacklist
                </h4>

                <div style="display: flex; gap: 5px; margin-bottom: 10px">
                    <input
                        id="blacklist-user-id"
                        placeholder="User ID to ban..."
                        style="
                            flex-grow: 1;
                            font-size: 11px;
                            padding: 5px;
                            background: #202225;
                            color: white;
                            border: 1px solid #444;
                            border-radius: 3px;
                        "
                    />
                    <button
                        onclick="manualBlacklist()"
                        style="
                            font-size: 11px;
                            padding: 5px 10px;
                            background: #ed4245;
                        "
                    >
                        Ban
                    </button>
                </div>

                <ul
                    id="blacklist-items"
                    style="
                        list-style: none;
                        padding: 0;
                        font-size: 12px;
                        max-height: 150px;
                        overflow-y: auto;
                    "
                ></ul>
            </div>

            <button
                onclick="logout()"
                style="margin-top: auto; background: #444"
            >
                Logout
            </button>
        </div>

        <div id="chat-container">
            <div
                style="
                    padding: 10px;
                    border-bottom: 1px solid #222;
                    display: flex;
                    justify-content: flex-end;
                "
            >
                <button
                    onclick="toggleMembers()"
                    style="background: #4f545c; padding: 5px 10px"
                >
                    👥 Members
                </button>
            </div>
            <ul id="messages"></ul>
            <div id="mention-suggestions" class="hidden"></div>
            <form id="input-area">
                <input
                    id="msg-input"
                    placeholder="Select a server..."
                    disabled
                />
                <input
                    type="file"
                    id="file-chooser"
                    style="display: none"
                    accept="image/*"
                />
                <button
                    type="button"
                    onclick="sendAssignmentLink()"
                    style="background: #0f9d58"
                    title="Share Assignment"
                >
                    📚
                </button>
                <button
                    type="button"
                    onclick="document.getElementById('file-chooser').click()"
                    style="background: #4f545c"
                >
                    📷
                </button>
            </form>
        </div>

        <div id="member-sidebar" class="hidden">
            <h3>Members</h3>
            <ul id="member-list"></ul>
        </div>

        <script>
            window.handleAuth = (type) => {
                if (window._handleAuth) window._handleAuth(type);
            };
        </script>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
            import {
                getFirestore,
                collection,
                addDoc,
                query,
                where,
                orderBy,
                onSnapshot,
                serverTimestamp,
                getDocs,
                doc,
                deleteDoc,
                limit,
                updateDoc,
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
            import {
                getAuth,
                createUserWithEmailAndPassword,
                signInWithEmailAndPassword,
                onAuthStateChanged,
                signOut,
                updateProfile,
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

            const firebaseConfig = {
                apiKey: "AIzaSyCRB2celD-ShWGOIXm2fpYLQXz36IB5vfE",
                authDomain: "schoolchat-e20ed.firebaseapp.com",
                projectId: "schoolchat-e20ed",
                storageBucket: "schoolchat-e20ed.firebasestorage.app",
                messagingSenderId: "344918432102",
                appId: "1:344918432102:web:d764d62de4c28e89dc10a7",
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            let currentUser = null;
            let currentServerId = null;
            let currentServerOwner = null;
            let unsubMessages = null;

            // --- PANIC FEATURE (CTRL + K) ---
            document.addEventListener("keydown", (e) => {
                if (e.ctrlKey && e.key.toLowerCase() === "k") {
                    e.preventDefault();
                    const img = document.getElementById("a");
                    img.style.display =
                        img.style.display === "none" ? "block" : "none";
                }
            });

            // --- AUTH ---
            window._handleAuth = (type) => {
                const email = document.getElementById("email").value;
                const pass = document.getElementById("password").value;
                const authFunc =
                    type === "register"
                        ? createUserWithEmailAndPassword
                        : signInWithEmailAndPassword;
                authFunc(auth, email, pass).catch((err) => alert(err.message));
            };

            window.logout = () => signOut(auth);

            onAuthStateChanged(auth, async (user) => {
                // Added async here
                if (user) {
                    currentUser = user;

                    // Update user status to online in the database
                    const q = query(
                        collection(db, "members"),
                        where("userId", "==", user.uid),
                    );
                    const snap = await getDocs(q);
                    const updates = snap.docs.map((mDoc) =>
                        updateDoc(doc(db, "members", mDoc.id), {
                            status: "online",
                        }),
                    );
                    await Promise.all(updates);

                    document.getElementById("auth-overlay").style.display =
                        "none";
                    document.getElementById("display-name-text").innerText =
                        user.displayName || user.email.split("@")[0];
                    loadUserServers();
                } else {
                    document.getElementById("auth-overlay").style.display =
                        "flex";
                }
            });

            window.changeUsername = async () => {
                const newName = prompt("Enter new username:");
                if (!newName) return;

                // 1. Check if name is already taken in the members collection
                const nameCheckQ = query(
                    collection(db, "members"),
                    where("displayName", "==", newName),
                );
                const nameCheckSnap = await getDocs(nameCheckQ);

                if (!nameCheckSnap.empty) {
                    alert(
                        "Error: This username is already taken by another user.",
                    );
                    return;
                }

                try {
                    // 2. Update Auth Profile
                    await updateProfile(auth.currentUser, {
                        displayName: newName,
                    });

                    // 3. Update all membership records for this user so the name change reflects everywhere
                    const userMembershipsQ = query(
                        collection(db, "members"),
                        where("userId", "==", currentUser.uid),
                    );
                    const membershipsSnap = await getDocs(userMembershipsQ);

                    const updates = membershipsSnap.docs.map((mDoc) =>
                        updateDoc(doc(db, "members", mDoc.id), {
                            displayName: newName,
                        }),
                    );
                    await Promise.all(updates);

                    document.getElementById("display-name-text").innerText =
                        newName;
                    alert("Username updated successfully!");
                } catch (err) {
                    alert("Error updating username: " + err.message);
                }
            };

            function loadMembers(serverId) {
                const q = query(
                    collection(db, "members"),
                    where("serverId", "==", serverId),
                );

                onSnapshot(q, (snap) => {
                    const list = document.getElementById("member-list");
                    list.innerHTML = "";

                    snap.forEach((doc) => {
                        const data = doc.data();
                        const li = document.createElement("li");

                        // --- UI Styling ---
                        li.style.cssText = `
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            margin-bottom: 12px;
                            color: #dcddde;
                            font-size: 14px;
                            padding: 4px 8px;
                            border-radius: 4px;
                        `;

                        // --- Online Status Logic ---
                        // We use a green color for 'online' and a grey color for anything else (offline)
                        // --- Updated Online/Idle Status Logic ---
                        let statusColor;
                        if (data.status === "online") {
                            statusColor = "#3ba55c"; // Green
                        } else if (data.status === "idle") {
                            statusColor = "#faa61a"; // Orange/Yellow (Discord style)
                        } else {
                            statusColor = "#747f8d"; // Grey (Offline)
                        }

                        // --- Name & Role Logic ---
                        const currentName =
                            data.displayName || data.userId.substring(0, 5);
                        let nameToShow = currentName;

                        // Check for duplicate names to prevent impersonation
                        const otherMembers = snap.docs.filter(
                            (d) => d.id !== doc.id,
                        );
                        const isDuplicate = otherMembers.some(
                            (d) => d.data().displayName === currentName,
                        );

                        if (isDuplicate && data.userEmail) {
                            nameToShow = data.userEmail;
                        }

                        const isOwner = data.userId === currentServerOwner;

                        // --- Constructing the HTML ---
                        li.innerHTML = `
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <div style="
                                    width: 10px;
                                    height: 10px;
                                    background-color: ${statusColor};
                                    border-radius: 50%;
                                    flex-shrink: 0;
                                    box-shadow: 0 0 2px rgba(0,0,0,0.5);
                                "></div>
                                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px;">
                                    ${isOwner ? '<span title="Owner" style="color: #faa61a; margin-right: 4px;">👑</span>' : ""}
                                    ${nameToShow}
                                </span>
                            </div>
                        `;

                        // --- Kick Button Logic (for Blacklisting) ---
                        if (
                            currentUser.uid === currentServerOwner &&
                            data.userId !== currentUser.uid
                        ) {
                            const btn = document.createElement("button");
                            btn.innerText = "Kick";
                            btn.className = "btn-danger";
                            btn.style.cssText =
                                "padding: 2px 6px; font-size: 10px; margin-left: 10px;";
                            // This triggers the blacklist logic we discussed previously
                            btn.onclick = () => kickMember(data.userId);
                            li.appendChild(btn);
                        }

                        list.appendChild(li);
                    });
                });
            }

            // --- MEMBER SIDEBAR TOGGLE ---
            window.toggleMembers = () => {
                const sidebar = document.getElementById("member-sidebar");
                sidebar.classList.toggle("hidden");
            };

            // --- ASSIGNMENT LINK ---
            window.sendAssignmentLink = async () => {
                const url = prompt(
                    "Paste the Google Classroom Assignment Link:",
                );
                if (!url || !url.includes("classroom.google.com")) {
                    alert("Please enter a valid Google Classroom link.");
                    return;
                }

                // Ask for a quick title so the chat looks nice
                const title =
                    prompt("Assignment Title (e.g., Math Homework):") ||
                    "Classroom Assignment";

                await addDoc(collection(db, "messages"), {
                    text: url,
                    assignmentTitle: title, // Store extra metadata
                    isAssignment: true, // Flag this as an assignment
                    userId: auth.currentUser.uid, // Store UID for security
                    serverId: currentServerId,
                    createdAt: serverTimestamp(),
                });
            };
            // --- SERVERS ---
            window.createServer = async () => {
                const name = prompt("Server Name:");
                if (!name) return;

                const iconUrl = prompt(
                    "Server Icon URL (optional - leave blank for letter):",
                );

                const code = Math.random()
                    .toString(36)
                    .substring(2, 7)
                    .toUpperCase();

                const sDoc = await addDoc(collection(db, "servers"), {
                    name,
                    inviteCode: code,
                    owner: currentUser.uid,
                    icon: iconUrl || null, // Store the URL or null
                });

                await addDoc(collection(db, "members"), {
                    serverId: sDoc.id,
                    userId: currentUser.uid,
                    serverName: name,
                    serverIcon: iconUrl || null, // Also store in members for quick loading
                    userEmail: currentUser.email,
                    displayName:
                        currentUser.displayName ||
                        currentUser.email.split("@")[0],
                });
            };

            window.joinServer = async () => {
                const code = prompt("Invite Code:");
                if (!code) return;
                const q = query(
                    collection(db, "servers"),
                    where("inviteCode", "==", code.toUpperCase()),
                );
                const snap = await getDocs(q);
                if (!snap.empty) {
                    const s = snap.docs[0];

                    // Check if already a member
                    const memberCheckQ = query(
                        collection(db, "members"),
                        where("serverId", "==", s.id),
                        where("userId", "==", currentUser.uid),
                    );
                    const memberCheckSnap = await getDocs(memberCheckQ);
                    if (!memberCheckSnap.empty) {
                        return alert(
                            "You are already a member of this server.",
                        );
                    }

                    const blackCheck = query(
                        collection(db, "blacklist"),
                        where("serverId", "==", s.id),
                        where("userId", "==", currentUser.uid),
                    );

                    let blackSnap;
                    try {
                        blackSnap = await getDocs(blackCheck);
                    } catch (e) {
                        blackSnap = { empty: true };
                    }

                    if (!blackSnap.empty) {
                        alert("You are blacklisted from this server.");
                        return;
                    }
                    await addDoc(collection(db, "members"), {
                        serverId: s.id,
                        userId: currentUser.uid,
                        serverName: s.data().name,
                        userEmail: currentUser.email,
                        displayName:
                            currentUser.displayName ||
                            currentUser.email.split("@")[0],
                    });
                    alert("Joined server!");
                    loadUserServers();
                } else alert("Invalid Code");
            };

            function loadUserServers() {
                const q = query(
                    collection(db, "members"),
                    where("userId", "==", currentUser.uid),
                );
                onSnapshot(q, (snap) => {
                    const list = document.getElementById("server-list");
                    list.innerHTML = "";
                    snap.forEach((mDoc) => {
                        const mData = mDoc.data();
                        const el = document.createElement("div");
                        el.className =
                            "server-icon" +
                            (currentServerId === mData.serverId
                                ? " active"
                                : "");

                        // --- FETCH LIVE SERVER DATA FOR ICON ---
                        onSnapshot(
                            doc(db, "servers", mData.serverId),
                            (sSnap) => {
                                if (sSnap.exists()) {
                                    const sData = sSnap.data();
                                    if (sData.icon) {
                                        el.style.backgroundImage = `url('${sData.icon}')`;
                                        el.style.backgroundSize = "cover";
                                        el.style.backgroundPosition = "center";
                                        el.innerText = "";
                                    } else {
                                        el.innerText =
                                            sData.name[0].toUpperCase();
                                        el.style.backgroundImage = "none";
                                    }
                                }
                            },
                        );
                        // --------------------------------------

                        el.onclick = () =>
                            selectServer(mData.serverId, mData.serverName);
                        list.appendChild(el);
                    });
                });
            }

            // --- IDLE / VISIBILITY TRACKING ---
            document.addEventListener("visibilitychange", async () => {
                if (!currentUser || !currentServerId) return;

                // Determine status based on if the tab is visible or hidden
                const newStatus =
                    document.visibilityState === "visible" ? "online" : "idle";

                try {
                    // Find all membership records for this user to update their status
                    const q = query(
                        collection(db, "members"),
                        where("userId", "==", currentUser.uid),
                    );
                    const snap = await getDocs(q);

                    const updates = snap.docs.map((mDoc) =>
                        updateDoc(doc(db, "members", mDoc.id), {
                            status: newStatus,
                        }),
                    );
                    await Promise.all(updates);
                } catch (err) {
                    console.error("Error updating visibility status:", err);
                }
            });

            window.manualBlacklist = async () => {
                const targetUserId = document
                    .getElementById("blacklist-user-id")
                    .value.trim();

                if (!targetUserId) return alert("Please enter a User ID.");
                if (targetUserId === currentUser.uid)
                    return alert("You cannot blacklist yourself.");

                try {
                    // 1. Check if already blacklisted
                    const q = query(
                        collection(db, "blacklist"),
                        where("serverId", "==", currentServerId),
                        where("userId", "==", targetUserId),
                    );
                    const snap = await getDocs(q);
                    if (!snap.empty)
                        return alert("User is already blacklisted.");

                    // 2. Add to blacklist
                    await addDoc(collection(db, "blacklist"), {
                        serverId: currentServerId,
                        userId: targetUserId,
                        bannedAt: serverTimestamp(),
                        manualEntry: true,
                    });

                    // 3. Remove existing membership if they are currently in the server
                    const memQ = query(
                        collection(db, "members"),
                        where("serverId", "==", currentServerId),
                        where("userId", "==", targetUserId),
                    );
                    const memSnap = await getDocs(memQ);
                    memSnap.forEach(async (mDoc) => {
                        await deleteDoc(doc(db, "members", mDoc.id));
                    });

                    document.getElementById("blacklist-user-id").value = "";
                    alert(
                        "User ID added to blacklist and removed from server.",
                    );
                } catch (err) {
                    alert("Error updating blacklist: " + err.message);
                }
            };

            // --- ADMIN & BLACKLIST ---
            window.manualBlacklist = async () => {
                const userIdInput =
                    document.getElementById("blacklist-user-id");
                const userId = userIdInput.value.trim();
                if (!userId || !currentServerId) return;

                if (currentServerOwner !== currentUser.uid) {
                    return alert("Only the server owner can ban users.");
                }

                try {
                    // 1. Add to blacklist collection
                    await addDoc(collection(db, "blacklist"), {
                        serverId: currentServerId,
                        userId: userId,
                        bannedAt: serverTimestamp(),
                    });

                    // 2. Remove from members if present
                    const q = query(
                        collection(db, "members"),
                        where("serverId", "==", currentServerId),
                        where("userId", "==", userId),
                    );
                    const snap = await getDocs(q);
                    const deletes = snap.docs.map((d) =>
                        deleteDoc(doc(db, "members", d.id)),
                    );
                    await Promise.all(deletes);

                    userIdInput.value = "";
                    alert("User banned successfully.");
                } catch (err) {
                    alert("Error banning user: " + err.message);
                }
            };

            window.selectServer = async (id, name) => {
                currentServerId = id;
                document.getElementById("current-server-name").innerText = name;
                document.getElementById("msg-input").disabled = false;
                document.getElementById("msg-input").placeholder =
                    `Message ${name}`;
                document.getElementById("leave-btn").style.display = "block";

                const q = query(collection(db, "servers"));
                const snap = await getDocs(q);
                const sInfo = snap.docs.find((d) => d.id === id);

                // --- NEW: AUTO-SYNC NAME FOR EXISTING USERS ---
                const memberQuery = query(
                    collection(db, "members"),
                    where("serverId", "==", id),
                    where("userId", "==", currentUser.uid),
                );
                const memberSnap = await getDocs(memberQuery);

                // Inside window.selectServer
                const isOwner = sInfo.owner === currentUser.uid;
                document.getElementById("admin-panel").style.display = isOwner
                    ? "block"
                    : "none";

                if (isOwner) {
                    try {
                        loadBlacklist(id);
                    } catch (e) {
                        console.error(
                            "Blacklist collection may not exist yet:",
                            e,
                        );
                    }
                }

                if (!memberSnap.empty) {
                    const memberDoc = memberSnap.docs[0];
                    const currentName =
                        currentUser.displayName ||
                        currentUser.email.split("@")[0];

                    // If the name is missing in the database, add it now
                    if (
                        !memberDoc.data().displayName ||
                        memberDoc.data().displayName !== currentName ||
                        !memberDoc.data().userEmail
                    ) {
                        await updateDoc(doc(db, "members", memberDoc.id), {
                            displayName: currentName,
                            userEmail: currentUser.email,
                        });
                    }
                }
                // ----------------------------------------------

                // --- MENTION STUFF ---
                const msgInput = document.getElementById("msg-input");
                const suggestionBox = document.getElementById(
                    "mention-suggestions",
                );

                msgInput.addEventListener("input", () => {
                    const value = msgInput.value;
                    const lastAtPos = value.lastIndexOf("@");

                    // Show suggestions only if @ is the last thing typed or being typed
                    if (
                        lastAtPos !== -1 &&
                        (lastAtPos === 0 || value[lastAtPos - 1] === " ")
                    ) {
                        const query = value
                            .substring(lastAtPos + 1)
                            .toLowerCase();
                        showMentionSuggestions(query, lastAtPos);
                    } else {
                        suggestionBox.classList.add("hidden");
                    }
                });

                async function showMentionSuggestions(query, atPos) {
                    // Get all members from the current server
                    const membersList = document.querySelectorAll(
                        "#member-list li span",
                    );
                    const members = Array.from(membersList).map((span) =>
                        span.innerText.replace("荘", "").trim(),
                    );

                    const filtered = members.filter((name) =>
                        name.toLowerCase().includes(query),
                    );

                    if (filtered.length > 0) {
                        suggestionBox.innerHTML = "";
                        filtered.forEach((name) => {
                            const div = document.createElement("div");
                            div.className = "mention-item";
                            div.innerText = name;
                            div.onclick = () => {
                                const before = msgInput.value.substring(
                                    0,
                                    atPos,
                                );
                                const after = msgInput.value.substring(
                                    msgInput.selectionStart,
                                );
                                msgInput.value = `${before}@${name} ${after}`;
                                suggestionBox.classList.add("hidden");
                                msgInput.focus();
                            };
                            suggestionBox.appendChild(div);
                        });
                        suggestionBox.classList.remove("hidden");
                    } else {
                        suggestionBox.classList.add("hidden");
                    }
                }

                // Close list if user clicks away
                document.addEventListener("click", (e) => {
                    if (e.target !== msgInput)
                        suggestionBox.classList.add("hidden");
                });

                // --- BLACKLIST UI ---
                async function loadBlacklist(serverId) {
                    const q = query(
                        collection(db, "blacklist"),
                        where("serverId", "==", serverId),
                    );

                    onSnapshot(q, (snap) => {
                        const list = document.getElementById("blacklist-items");
                        list.innerHTML = "";

                        if (snap.empty) {
                            list.innerHTML =
                                "<li style='color: #72767d;'>No banned users.</li>";
                            return;
                        }

                        snap.forEach((bDoc) => {
                            const data = bDoc.data();
                            const li = document.createElement("li");
                            li.style.cssText =
                                "display: flex; justify-content: space-between; margin-bottom: 5px;";
                            li.innerHTML = `
                                <span>ID: ${data.userId.substring(0, 5)}</span>
                                <button onclick="unbanUser('${bDoc.id}')" style="background:none; color:var(--accent); padding:0; font-size:10px;">Unban</button>
                            `;
                            list.appendChild(li);
                        });
                    });
                }

                window.unbanUser = async (blacklistDocId) => {
                    if (confirm("Remove user from blacklist?")) {
                        await deleteDoc(doc(db, "blacklist", blacklistDocId));
                        alert("User unbanned.");
                    }
                };

                // kick listener
                const kickListenerQ = query(
                    collection(db, "members"),
                    where("serverId", "==", id),
                    where("userId", "==", currentUser.uid),
                );

                onSnapshot(kickListenerQ, (snap) => {
                    if (snap.empty && currentServerId === id) {
                        alert("You have been kicked from this server.");
                        location.reload(); // Refreshing clears the state and returns to login/server select
                    }
                });

                if (sInfo) {
                    const sData = sInfo.data();
                    currentServerOwner = sData.owner;
                    document.getElementById("invite-display").innerText =
                        `CODE: ${sData.inviteCode}`;
                    const isOwner = sData.owner === currentUser.uid;
                    document.getElementById("delete-btn").style.display =
                        isOwner ? "block" : "none";
                }
                loadMessages(id);
                loadMembers(id);
            };

            window.leaveServer = async () => {
                if (!currentServerId || !confirm("Leave this server?")) return;
                const q = query(
                    collection(db, "members"),
                    where("serverId", "==", currentServerId),
                    where("userId", "==", currentUser.uid),
                );
                const snap = await getDocs(q);
                await Promise.all(
                    snap.docs.map((d) => deleteDoc(doc(db, "members", d.id))),
                );
                location.reload();
            };

            window.deleteServer = async () => {
                if (!currentServerId || !confirm("DELETE SERVER PERMANENTLY?"))
                    return;
                if (currentServerOwner !== currentUser.uid)
                    return alert("Unauthorized");
                await deleteDoc(doc(db, "servers", currentServerId));
                location.reload();
            };

            window.kickMember = async (targetUserId) => {
                if (currentServerOwner !== currentUser.uid) {
                    return alert("Only the server owner can kick members.");
                }

                if (targetUserId === currentUser.uid) {
                    return alert(
                        "You cannot kick yourself! Use 'Leave Server' instead.",
                    );
                }

                if (!confirm("Are you sure you want to kick this member?"))
                    return;

                try {
                    // Find the membership document for this user in this server
                    const q = query(
                        collection(db, "members"),
                        where("serverId", "==", currentServerId),
                        where("userId", "==", targetUserId),
                    );

                    const snap = await getDocs(q);

                    if (!snap.empty) {
                        // Delete the membership record
                        await deleteDoc(doc(db, "members", snap.docs[0].id));
                        alert("Member kicked successfully.");
                        // Refresh member list if you have a separate UI for it
                    } else {
                        alert("Member not found.");
                    }
                } catch (err) {
                    alert("Error kicking member: " + err.message);
                }
                if (!confirm("Kick and blacklist this member?")) return;

                try {
                    // 1. Add to blacklist
                    await addDoc(collection(db, "blacklist"), {
                        serverId: currentServerId,
                        userId: targetUserId,
                        bannedAt: serverTimestamp(),
                    });

                    // 2. Remove membership (existing logic)
                    const q = query(
                        collection(db, "members"),
                        where("serverId", "==", currentServerId),
                        where("userId", "==", targetUserId),
                    );
                    const snap = await getDocs(q);
                    if (!snap.empty)
                        await deleteDoc(doc(db, "members", snap.docs[0].id));

                    alert("Member blacklisted.");
                } catch (err) {
                    alert(err.message);
                }
            };

            // --- SERVER ICON ---
            window.editServerIcon = async () => {
                if (currentServerOwner !== currentUser.uid)
                    return alert(
                        "Only owners can change the icon.\n\nSorry for giving you hope lol",
                    );

                const newIcon = prompt("Paste new Icon URL:");
                if (newIcon === null) return;

                try {
                    // Update the main server doc - observers will react automatically
                    const serverRef = doc(db, "servers", currentServerId);
                    await updateDoc(serverRef, { icon: newIcon });

                    alert(
                        "Icon updated! Everyone will see the change immediately.",
                    );
                } catch (err) {
                    alert("Error updating icon: " + err.message);
                }
            };

            // --- MESSAGES & DELETION ---
            window.deleteMessage = async (messageId) => {
                if (!confirm("Delete this message?")) return;
                try {
                    await deleteDoc(doc(db, "messages", messageId));
                } catch (err) {
                    alert("Error deleting message: " + err.message);
                }
            };

            function loadMessages(serverId) {
                if (unsubMessages) unsubMessages();

                // Load all members for this server once to map UIDs to names
                const membersQ = query(
                    collection(db, "members"),
                    where("serverId", "==", serverId),
                );
                getDocs(membersQ).then((memberSnap) => {
                    const memberMap = {};
                    memberSnap.forEach((mDoc) => {
                        const mData = mDoc.data();
                        memberMap[mData.userId] =
                            mData.displayName ||
                            mData.userEmail ||
                            mData.userId.substring(0, 5);
                    });

                    const q = query(
                        collection(db, "messages"),
                        where("serverId", "==", serverId),
                        orderBy("createdAt", "desc"),
                        limit(75),
                    );

                    unsubMessages = onSnapshot(q, (snap) => {
                        const list = document.getElementById("messages");
                        list.innerHTML = "";
                        const docs = [...snap.docs].reverse();
                        let lastMsg = null;

                        // Helper function for images
                        const checkIsImg = (url) =>
                            typeof url === "string" &&
                            (url.startsWith("data:image") ||
                                /\.(jpg|jpeg|png|gif)$/i.test(url));

                        docs.forEach((doc) => {
                            const data = doc.data();
                            const messageId = doc.id;
                            const createdAt = data.createdAt?.toDate();
                            const time = createdAt
                                ? createdAt.toLocaleTimeString([], {
                                      hour: "2-digit",
                                      minute: "2-digit",
                                  })
                                : "...";

                            // --- NEW PROCESSING LOGIC ---
                            let content = data.text;

                            // 1. Link Detector: Converts standard URLs into clickable links
                            const urlRegex = /(https?:\/\/[^\s]+)/g;

                            content = content.replace(urlRegex, (url) => {
                                // Check if the URL ends with .png, .jpg, .jpeg, or .gif (case-insensitive)
                                if (/\.(png|jpe?g|gif)$/i.test(url)) {
                                    return url; // Return the plain text without the <a> tag
                                }

                                return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
                            });

                            // 2. Username Mention: Checks for @name and highlights it if the user exists
                            // --- Smart Mention Detector (Handles spaces & emojis) ---
                            const mentionRegex = /@([^\n]+)/g; // Look at everything after the @ on that line

                            content = content.replace(
                                mentionRegex,
                                (match, fullTextAfterAt) => {
                                    // We get a list of all current usernames in the server
                                    const usernames = Object.values(memberMap);

                                    // Sort usernames by length (longest first) so we don't
                                    // accidentally match "Greg" if the user is "Greg 😄"
                                    const sortedUsernames = usernames.sort(
                                        (a, b) => b.length - a.length,
                                    );

                                    for (let name of sortedUsernames) {
                                        // Check if the text immediately following the @ starts with a valid username
                                        if (
                                            fullTextAfterAt
                                                .toLowerCase()
                                                .startsWith(name.toLowerCase())
                                        ) {
                                            const actualNameInText =
                                                fullTextAfterAt.substring(
                                                    0,
                                                    name.length,
                                                );
                                            const remainingText =
                                                fullTextAfterAt.substring(
                                                    name.length,
                                                );

                                            return `<span style="background: rgba(88, 101, 242, 0.3); color: #dee0fc; padding: 0 4px; border-radius: 3px; font-weight: 500;">@${actualNameInText}</span>${remainingText}`;
                                        }
                                    }

                                    // If no member matches the text after @, leave it alone
                                    return match;
                                },
                            );
                            // -----------------------------

                            // 1. Handle Assignment Cards
                            if (data.isAssignment) {
                                content = `
                                    <div style="background: #e8f0fe; border-left: 5px solid #1967d2; padding: 12px; border-radius: 4px; color: #1967d2; margin-top: 5px; max-width: 300px;">
                                        <div style="font-weight: bold; font-size: 14px; margin-bottom: 4px;">📚 ${data.assignmentTitle}</div>
                                        <a href="${data.text}" target="_blank" style="display: inline-block; background: #1967d2; color: white; padding: 5px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold;">
                                            Open in Classroom
                                        </a>
                                    </div>`;
                            }
                            // 2. Handle Images
                            else if (checkIsImg(data.text)) {
                                content = `<img src="${data.text}" style="max-width: 100%; max-height: 300px; border-radius: 8px; display: block; margin-top: 5px;">`;
                            }

                            const senderName =
                                memberMap[data.userId] ||
                                data.user ||
                                "Unknown User";
                            const isSender = data.userId === currentUser.uid;
                            const isOwner =
                                currentUser.uid === currentServerOwner;

                            const deleteBtn =
                                isSender || isOwner
                                    ? `<span class="delete-btn" onclick="deleteMessage('${messageId}')">❌</span>`
                                    : "";

                            const li = document.createElement("li");

                            // 3. Grouping Logic
                            if (
                                lastMsg &&
                                lastMsg.userId === data.userId &&
                                createdAt - lastMsg.createdAt?.toDate() < 300000
                            ) {
                                li.className = "grouped";
                                li.innerHTML = `<div>${content} ${deleteBtn}</div>`;
                            } else {
                                li.innerHTML = `<span class="msg-user">${senderName}</span><span class="msg-time">${time}</span> ${deleteBtn}<br>${content}`;
                            }

                            list.appendChild(li);
                            lastMsg = { ...data, createdAt: data.createdAt }; // Store for next loop
                        });
                        list.scrollTop = list.scrollHeight;
                    });
                });
            }

            document.getElementById("input-area").onsubmit = async (e) => {
                e.preventDefault();
                const val = document.getElementById("msg-input").value;
                if (!val || !currentServerId) return;
                document.getElementById("msg-input").value = "";
                await addDoc(collection(db, "messages"), {
                    text: val,
                    userId: auth.currentUser.uid,
                    serverId: currentServerId,
                    createdAt: serverTimestamp(),
                });
            };

            document.getElementById("file-chooser").onchange = async (e) => {
                const file = e.target.files[0];
                if (!file || !currentServerId) return;
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    await addDoc(collection(db, "messages"), {
                        text: reader.result,
                        userId: auth.currentUser.uid,
                        serverId: currentServerId,
                        createdAt: serverTimestamp(),
                    });
                };
            };
        </script>
    </body>
</html>
