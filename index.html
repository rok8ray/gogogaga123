<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Google Drive</title>
        <link id="favicon" rel="icon" href="/assets/favicon.png" />
        <style>
            :root {
                --bg-dark: #202225;
                --bg-sidebar: #2f3136;
                --bg-chat: #36393f;
                --text-main: #dcddde;
                --accent: #5865f2;
            }
            body {
                margin: 0;
                display: flex;
                height: 100vh;
                font-family: sans-serif;
                background: var(--bg-dark);
                color: var(--text-main);
                overflow: hidden;
            }

            #full-screen-img {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                object-fit: cover;
                z-index: 9999;
                display: none;
            }

            /* Sidebar for Servers */
            #server-sidebar {
                width: 72px;
                background: var(--bg-dark);
                display: flex;
                flex-direction: column;
                align-items: center;
                padding-top: 12px;
                gap: 8px;
                border-right: 1px solid #222;
            }
            .server-icon {
                width: 48px;
                height: 48px;
                background: var(--bg-sidebar);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: 0.2s;
                font-weight: bold;
            }
            .server-icon:hover {
                border-radius: 30%;
                background: var(--accent);
                color: white;
            }

            /* Channel Sidebar */
            #channel-sidebar {
                width: 240px;
                background: var(--bg-sidebar);
                padding: 20px;
                display: flex;
                flex-direction: column;
            }

            /* Chat Area */
            #chat-container {
                flex-grow: 1;
                background: var(--bg-chat);
                display: flex;
                flex-direction: column;
                overflow-wrap: break-word;
            }
            #messages {
                flex-grow: 1;
                overflow-y: auto;
                padding: 20px;
                list-style: none;
                margin: 0;
            }
            #messages li {
                margin-bottom: 15px;
                word-break: break-word;
            }
            #messages li.grouped {
                margin-top: -10px;
                padding-left: 0px;
            }

            .chat-img {
                max-width: 100%;
                max-height: 300px;
                border-radius: 8px;
                margin-top: 5px;
                display: block;
                cursor: pointer;
            }

            .msg-user {
                font-weight: bold;
                color: white;
                margin-right: 8px;
            }
            .msg-time {
                font-size: 0.75rem;
                color: #72767d;
            }

            /* Input Area */
            #input-area {
                padding: 20px;
                display: flex;
                gap: 10px;
            }
            #msg-input {
                flex-grow: 1;
                padding: 12px;
                border-radius: 8px;
                border: none;
                background: #40444b;
                color: white;
            }

            /* Auth UI */
            #auth-overlay {
                position: fixed;
                inset: 0;
                background: #202225;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
            }
            .auth-card {
                background: #36393f;
                padding: 30px;
                border-radius: 8px;
                width: 300px;
                display: flex;
                flex-direction: column;
                gap: 15px;
            }
            input[type="email"],
            input[type="password"] {
                padding: 10px;
                background: #202225;
                color: white;
                border: none;
                border-radius: 4px;
            }
            button {
                padding: 10px;
                background: var(--accent);
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }

            hr {
                border: 0;
                border-top: 1px solid #444;
                width: 100%;
                margin: 10px 0;
            }

            .bg-image {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                object-fit: cover;
                z-index: -1;
            }
        </style>
    </head>
    <body>
        <img
            id="full-screen-img"
            src="/assets/drive.png"
            alt="Full Screen Image"
        />

        <div id="auth-overlay">
            <div class="auth-card">
                <h2 style="margin: 0">Welcome!</h2>
                <input type="email" id="email" placeholder="Email" />
                <input type="password" id="password" placeholder="Password" />
                <button onclick="handleAuth('login')">Login</button>
                <button
                    onclick="handleAuth('register')"
                    style="background: #444"
                >
                    Register
                </button>
            </div>
        </div>

        <div id="server-sidebar">
            <div
                class="server-icon"
                onclick="createServer()"
                title="Create Server"
            >
                +
            </div>
            <div class="server-icon" onclick="joinServer()" title="Join Server">
                🔍
            </div>
            <hr />
            <div id="server-list"></div>
        </div>

        <div id="channel-sidebar">
            <h3 id="current-server-name">Select a Server</h3>
            <p id="invite-display" style="font-size: 12px; color: #aaa"></p>
            <div
                style="
                    margin-top: 10px;
                    display: flex;
                    flex-direction: column;
                    gap: 5px;
                "
            >
                <button
                    onclick="changeUsername()"
                    style="background: #4f545c; font-size: 11px"
                >
                    Edit Name
                </button>
                <button
                    id="delete-btn"
                    onclick="deleteCurrentServer()"
                    style="display: none; background: #f04747; font-size: 11px"
                >
                    Delete Server
                </button>
                <button
                    id="leave-btn"
                    onclick="leaveCurrentServer()"
                    style="display: none; background: #f04747; font-size: 11px"
                >
                    Leave Server
                </button>
            </div>
            <button
                onclick="logout()"
                style="margin-top: auto; background: #444"
            >
                Logout
            </button>
        </div>

        <div id="chat-container">
            <ul id="messages"></ul>
            <form id="input-area">
                <input
                    id="msg-input"
                    placeholder="Select a server..."
                    disabled
                />
                <button
                    type="button"
                    onclick="sendImageUrl()"
                    style="background: #4f545c"
                >
                    📷
                </button>
            </form>
        </div>

        <img
            src="https://i.postimg.cc/bNvZGqhm/Screenshot-2026-01-24-153621.png"
            class="bg-image"
            id="bg-image"
        />

        <script>
            window.handleAuth = (type) => {
                if (window._handleAuth) window._handleAuth(type);
            };
        </script>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
            import {
                getFirestore,
                collection,
                addDoc,
                query,
                where,
                orderBy,
                onSnapshot,
                serverTimestamp,
                getDocs,
                deleteDoc,
                doc,
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
            import {
                getAuth,
                createUserWithEmailAndPassword,
                signInWithEmailAndPassword,
                onAuthStateChanged,
                signOut,
                updateProfile,
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

            const firebaseConfig = {
                apiKey: "AIzaSyCRB2celD-ShWGOIXm2fpYLQXz36IB5vfE",
                authDomain: "schoolchat-e20ed.firebaseapp.com",
                projectId: "schoolchat-e20ed",
                storageBucket: "schoolchat-e20ed.firebasestorage.app",
                messagingSenderId: "344918432102",
                appId: "1:344918432102:web:d764d62de4c28e89dc10a7",
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            let currentUser = null;
            let currentServerId = null;
            let unsubMessages = null;

            // Panic Button Logic
            document.addEventListener("keydown", (e) => {
                if (e.ctrlKey && e.key === "k") {
                    e.preventDefault();
                    const drive = document.getElementById("full-screen-img");
                    drive.style.display =
                        drive.style.display === "none" ||
                        drive.style.display === ""
                            ? "block"
                            : "none";
                }
            });

            // Auth Logic
            window._handleAuth = (type) => {
                const email = document.getElementById("email").value;
                const pass = document.getElementById("password").value;
                const authFunc =
                    type === "register"
                        ? createUserWithEmailAndPassword
                        : signInWithEmailAndPassword;
                authFunc(auth, email, pass).catch((err) => alert(err.message));
            };
            window.logout = () => signOut(auth);

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    document.getElementById("auth-overlay").style.display =
                        "none";
                    loadUserServers();
                } else {
                    document.getElementById("auth-overlay").style.display =
                        "flex";
                }
            });

            // Server Logic
            window.createServer = async () => {
                const name = prompt("Server Name:");
                if (!name) return;
                const code = Math.random()
                    .toString(36)
                    .substring(2, 7)
                    .toUpperCase();
                const serverDoc = await addDoc(collection(db, "servers"), {
                    name,
                    inviteCode: code,
                    owner: currentUser.uid,
                });
                await addDoc(collection(db, "members"), {
                    serverId: serverDoc.id,
                    userId: currentUser.uid,
                    serverName: name,
                });
            };

            window.joinServer = async () => {
                const code = prompt("Invite Code:");
                if (!code) return;
                const q = query(
                    collection(db, "servers"),
                    where("inviteCode", "==", code.toUpperCase()),
                );
                const snap = await getDocs(q);
                if (!snap.empty) {
                    const s = snap.docs[0];
                    await addDoc(collection(db, "members"), {
                        serverId: s.id,
                        userId: currentUser.uid,
                        serverName: s.data().name,
                    });
                } else alert("Invalid Code");
            };

            function loadUserServers() {
                const q = query(
                    collection(db, "members"),
                    where("userId", "==", currentUser.uid),
                );
                onSnapshot(q, (snap) => {
                    const list = document.getElementById("server-list");
                    list.innerHTML = "";
                    snap.forEach((doc) => {
                        const data = doc.data();
                        const el = document.createElement("div");
                        el.className = "server-icon";
                        el.innerText = data.serverName[0].toUpperCase();
                        el.onclick = () =>
                            selectServer(data.serverId, data.serverName);
                        list.appendChild(el);
                    });
                });
            }

            async function selectServer(id, name) {
                currentServerId = id;
                document.getElementById("current-server-name").innerText = name;
                document.getElementById("msg-input").disabled = false;
                document.getElementById("msg-input").placeholder =
                    `Message ${name}`;

                const q_server = await getDocs(
                    query(collection(db, "servers")),
                );
                const serverInfo = q_server.docs.find((d) => d.id === id);
                if (serverInfo) {
                    const data = serverInfo.data();
                    document.getElementById("invite-display").innerText =
                        `Code: ${data.inviteCode}`;
                    document.getElementById("delete-btn").style.display =
                        data.owner === currentUser.uid ? "block" : "none";
                    document.getElementById("leave-btn").style.display =
                        data.owner === currentUser.uid ? "none" : "block";
                }
                loadMessages();
            }

            // Image URL Logic
            window.sendImageUrl = async () => {
                const url = prompt(
                    "Paste Image URL (ending in .png, .jpg, .gif):",
                );
                if (!url || !currentServerId) return;
                await addDoc(collection(db, "messages"), {
                    text: url,
                    user:
                        currentUser.displayName ||
                        currentUser.email.split("@")[0],
                    serverId: currentServerId,
                    createdAt: serverTimestamp(),
                });
            };

            function loadMessages() {
                if (unsubMessages) unsubMessages();
                const q = query(
                    collection(db, "messages"),
                    where("serverId", "==", currentServerId),
                    orderBy("createdAt", "asc"),
                );

                const isImageUrl = (url) =>
                    url.match(/\.(jpeg|jpg|gif|png|webp)$/) != null ||
                    url.startsWith("data:image");

                unsubMessages = onSnapshot(q, (snap) => {
                    const list = document.getElementById("messages");
                    list.innerHTML = "";
                    let lastMsg = null;

                    snap.forEach((doc) => {
                        const data = doc.data();
                        const time =
                            data.createdAt?.toDate().toLocaleTimeString([], {
                                hour: "2-digit",
                                minute: "2-digit",
                            }) || "...";
                        const li = document.createElement("li");

                        // Grouping Logic
                        let isGrouped =
                            lastMsg &&
                            lastMsg.user === data.user &&
                            data.createdAt?.toDate() -
                                lastMsg.createdAt?.toDate() <
                                3600000;

                        // Render Image or Text
                        let content = isImageUrl(data.text)
                            ? `<img src="${data.text}" class="chat-img" onclick="window.open('${data.text}')">`
                            : `<span>${data.text}</span>`;

                        if (isGrouped) {
                            li.className = "grouped";
                            li.innerHTML = `<div>${content}</div>`;
                        } else {
                            li.innerHTML = `<span class="msg-user">${data.user}</span><span class="msg-time">${time}</span><br>${content}`;
                        }
                        list.appendChild(li);
                        lastMsg = data;
                    });
                    list.scrollTop = list.scrollHeight;
                });
            }

            document.getElementById("input-area").onsubmit = async (e) => {
                e.preventDefault();
                const input = document.getElementById("msg-input");
                if (!input.value || !currentServerId) return;
                await addDoc(collection(db, "messages"), {
                    text: input.value,
                    user:
                        currentUser.displayName ||
                        currentUser.email.split("@")[0],
                    serverId: currentServerId,
                    createdAt: serverTimestamp(),
                });
                input.value = "";
            };
        </script>
    </body>
</html>
