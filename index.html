<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Google Drive</title>
        <link id="favicon" rel="icon" href="/assets/favicon.png" />
        <style>
            :root {
                --bg-dark: #202225;
                --bg-sidebar: #2f3136;
                --bg-chat: #36393f;
                --text-main: #dcddde;
                --accent: #5865f2;
                --danger: #ed4245;
            }
            body {
                margin: 0;
                display: flex;
                height: 100vh;
                font-family: sans-serif;
                background: var(--bg-dark);
                color: var(--text-main);
                overflow: hidden;
            }

            /* Server List (Far Left) */
            #server-sidebar {
                width: 72px;
                min-width: 72px;
                background: var(--bg-dark);
                display: flex;
                flex-direction: column;
                align-items: center;
                padding-top: 12px;
                gap: 8px;
                border-right: 1px solid #222;
            }
            .server-icon {
                width: 48px;
                height: 48px;
                background: var(--bg-sidebar);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: 0.2s;
                font-weight: bold;
                color: var(--text-main);
                text-decoration: none;
            }
            .server-icon:hover,
            .server-icon.active {
                border-radius: 30%;
                background: var(--accent);
                color: white;
            }

            /* Channel/Settings Sidebar */
            #channel-sidebar {
                width: 240px;
                background: var(--bg-sidebar);
                padding: 20px;
                display: flex;
                flex-direction: column;
            }
            #user-info {
                padding: 10px;
                background: rgba(0, 0, 0, 0.2);
                border-radius: 5px;
                margin-bottom: 15px;
            }

            /* Chat Area */
            #chat-container {
                flex-grow: 1;
                min-width: 0;
                background: var(--bg-chat);
                display: flex;
                flex-direction: column;
            }
            #messages {
                flex-grow: 1;
                overflow-y: auto;
                padding: 20px;
                list-style: none;
                margin: 0;
            }
            #messages li {
                margin-bottom: 15px;
            }
            #messages li.grouped {
                margin-top: -10px;
                padding-left: 0;
            }
            .msg-user {
                font-weight: bold;
                color: white;
                margin-right: 8px;
            }
            .msg-time {
                font-size: 0.75rem;
                color: #72767d;
            }
            /* 1. Hide the delete button by default */
            .delete-btn {
                opacity: 0;
                transition: opacity 0.2s ease;
                cursor: pointer;
                color: var(--danger);
                margin-left: 8px;
                font-size: 10px;
                font-weight: bold;
                background: rgba(0, 0, 0, 0.1);
                padding: 2px 5px;
                border-radius: 4px;
            }

            /* 2. Show the button when the parent <li> is hovered */
            #messages li:hover .delete-btn {
                opacity: 1;
            }

            /* 3. Also show it when a grouped message is hovered */
            .grouped:hover .delete-btn {
                opacity: 1;
            }

            /* Inputs/Buttons */
            #input-area {
                padding: 20px;
                display: flex;
                gap: 10px;
            }
            #msg-input {
                flex-grow: 1;
                padding: 12px;
                border-radius: 8px;
                border: none;
                background: #40444b;
                color: white;
            }
            button {
                padding: 10px;
                background: var(--accent);
                border: none;
                color: white;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }
            .btn-danger {
                background: var(--danger);
                margin-top: 5px;
            }

            #auth-overlay {
                position: fixed;
                inset: 0;
                background: #202225;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
            }
            .auth-card {
                background: #36393f;
                padding: 30px;
                border-radius: 8px;
                width: 300px;
                display: flex;
                flex-direction: column;
                gap: 15px;
            }
            input[type="email"],
            input[type="password"] {
                padding: 10px;
                border-radius: 4px;
                border: none;
                background: #202225;
                color: white;
            }
        </style>
    </head>
    <body>
        <div id="auth-overlay">
            <div class="auth-card">
                <h2 style="margin: 0">Welcome!</h2>
                <input type="email" id="email" placeholder="Email" />
                <input type="password" id="password" placeholder="Password" />
                <button onclick="handleAuth('login')">Login</button>
                <button
                    onclick="handleAuth('register')"
                    style="background: #444"
                >
                    Register
                </button>
            </div>
        </div>

        <div id="server-sidebar">
            <div
                class="server-icon"
                onclick="createServer()"
                title="Create Server"
            >
                +
            </div>
            <div class="server-icon" onclick="joinServer()" title="Join Server">
                🔍
            </div>
            <hr style="width: 40px; border: 1px solid #444; margin: 5px 0" />
            <div id="server-list"></div>
        </div>

        <div id="channel-sidebar">
            <h3 id="current-server-name">Select a Server</h3>
            <p
                id="invite-display"
                style="font-size: 11px; color: #aaa; margin-top: -10px"
            ></p>

            <div id="user-info">
                <div style="font-size: 12px; color: #aaa">Logged in as:</div>
                <div
                    id="display-name-text"
                    style="font-weight: bold; color: #fff"
                >
                    ...
                </div>
            </div>
            <img
                id="a"
                style="
                    display: none;
                    top: 0;
                    left: 0;
                    width: 100vw;
                    height: 100vh;
                    object-fit: cover;
                    position: fixed;
                    z-index: 100000000000000000000000000000000000000000000;
                "
                src="/assets/drive.png"
            />
            <div style="display: flex; flex-direction: column; gap: 5px">
                <button
                    onclick="changeUsername()"
                    style="background: #4f545c; font-size: 12px"
                >
                    Edit Username
                </button>
                <button
                    id="leave-btn"
                    onclick="leaveServer()"
                    class="btn-danger"
                    style="display: none"
                >
                    Leave Server
                </button>
                <button
                    id="delete-btn"
                    onclick="deleteServer()"
                    class="btn-danger"
                    style="display: none; background: #a12d2f"
                >
                    Delete Server
                </button>
            </div>
            <div
                id="member-sidebar"
                style="
                    width: 200px;
                    background: var(--bg-sidebar);
                    padding: 20px;
                    border-left: 1px solid #222;
                "
            >
                <h3>Members</h3>
                <ul id="member-list" style="list-style: none; padding: 0"></ul>
            </div>

            <button
                onclick="logout()"
                style="margin-top: auto; background: #444"
            >
                Logout
            </button>
        </div>

        <div id="chat-container">
            <ul id="messages"></ul>
            <form id="input-area">
                <input
                    id="msg-input"
                    placeholder="Select a server..."
                    disabled
                />
                <input
                    type="file"
                    id="file-chooser"
                    style="display: none"
                    accept="image/*"
                />
                <button
                    type="button"
                    onclick="document.getElementById('file-chooser').click()"
                    style="background: #4f545c"
                >
                    📷
                </button>
            </form>
        </div>

        <script>
            window.handleAuth = (type) => {
                if (window._handleAuth) window._handleAuth(type);
            };
        </script>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
            import {
                getFirestore,
                collection,
                addDoc,
                query,
                where,
                orderBy,
                onSnapshot,
                serverTimestamp,
                getDocs,
                doc,
                deleteDoc,
                limit,
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
            import {
                getAuth,
                createUserWithEmailAndPassword,
                signInWithEmailAndPassword,
                onAuthStateChanged,
                signOut,
                updateProfile,
            } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

            const firebaseConfig = {
                apiKey: "AIzaSyCRB2celD-ShWGOIXm2fpYLQXz36IB5vfE",
                authDomain: "schoolchat-e20ed.firebaseapp.com",
                projectId: "schoolchat-e20ed",
                storageBucket: "schoolchat-e20ed.firebasestorage.app",
                messagingSenderId: "344918432102",
                appId: "1:344918432102:web:d764d62de4c28e89dc10a7",
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            let currentUser = null;
            let currentServerId = null;
            let currentServerOwner = null;
            let unsubMessages = null;

            // --- PANIC FEATURE (CTRL + K) ---
            document.addEventListener("keydown", (e) => {
                if (e.ctrlKey && e.key.toLowerCase() === "k") {
                    e.preventDefault();
                    const img = document.getElementById("a");
                    img.style.display =
                        img.style.display === "none" ? "block" : "none";
                }
            });

            // --- AUTH ---
            window._handleAuth = (type) => {
                const email = document.getElementById("email").value;
                const pass = document.getElementById("password").value;
                const authFunc =
                    type === "register"
                        ? createUserWithEmailAndPassword
                        : signInWithEmailAndPassword;
                authFunc(auth, email, pass).catch((err) => alert(err.message));
            };

            window.logout = () => signOut(auth);

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    document.getElementById("auth-overlay").style.display =
                        "none";
                    document.getElementById("display-name-text").innerText =
                        user.displayName || user.email.split("@")[0];
                    loadUserServers();
                } else {
                    document.getElementById("auth-overlay").style.display =
                        "flex";
                }
            });

            window.changeUsername = async () => {
                const newName = prompt("Enter new username:");
                if (!newName) return;
                await updateProfile(auth.currentUser, { displayName: newName });
                document.getElementById("display-name-text").innerText =
                    newName;
            };

            function loadMembers(serverId) {
                const q = query(
                    collection(db, "members"),
                    where("serverId", "==", serverId),
                );

                onSnapshot(q, (snap) => {
                    const list = document.getElementById("member-list");
                    list.innerHTML = "";

                    snap.forEach((doc) => {
                        const data = doc.data();
                        const li = document.createElement("li");
                        li.style.marginBottom = "10px";
                        li.style.display = "flex";
                        li.style.justifyContent = "space-between";
                        li.style.alignItems = "center";

                        // UI for the member name
                        li.innerHTML = `<span>${data.userId === currentServerOwner ? "👑 " : ""}${data.userId.substring(0, 5)}...</span>`;

                        // If current user is owner, show kick button next to others
                        if (
                            currentUser.uid === currentServerOwner &&
                            data.userId !== currentUser.uid
                        ) {
                            const btn = document.createElement("button");
                            btn.innerText = "Kick";
                            btn.style.padding = "2px 5px";
                            btn.style.fontSize = "10px";
                            btn.className = "btn-danger";
                            btn.onclick = () => kickMember(data.userId);
                            li.appendChild(btn);
                        }

                        list.appendChild(li);
                    });
                });
            }

            // --- SERVERS ---
            window.createServer = async () => {
                const name = prompt("Server Name:");
                if (!name) return;
                const code = Math.random()
                    .toString(36)
                    .substring(2, 7)
                    .toUpperCase();
                const sDoc = await addDoc(collection(db, "servers"), {
                    name,
                    inviteCode: code,
                    owner: currentUser.uid,
                });
                await addDoc(collection(db, "members"), {
                    serverId: sDoc.id,
                    userId: currentUser.uid,
                    serverName: name,
                });
            };

            window.joinServer = async () => {
                const code = prompt("Invite Code:");
                if (!code) return;
                const q = query(
                    collection(db, "servers"),
                    where("inviteCode", "==", code.toUpperCase()),
                );
                const snap = await getDocs(q);
                if (!snap.empty) {
                    const s = snap.docs[0];
                    await addDoc(collection(db, "members"), {
                        serverId: s.id,
                        userId: currentUser.uid,
                        serverName: s.data().name,
                    });
                } else alert("Invalid Code");
            };

            function loadUserServers() {
                const q = query(
                    collection(db, "members"),
                    where("userId", "==", currentUser.uid),
                );
                onSnapshot(q, (snap) => {
                    const list = document.getElementById("server-list");
                    list.innerHTML = "";
                    snap.forEach((doc) => {
                        const data = doc.data();
                        const el = document.createElement("div");
                        el.className =
                            "server-icon" +
                            (currentServerId === data.serverId
                                ? " active"
                                : "");
                        el.innerText = data.serverName[0].toUpperCase();
                        el.onclick = () =>
                            selectServer(data.serverId, data.serverName);
                        list.appendChild(el);
                    });
                });
            }

            window.selectServer = async (id, name) => {
                currentServerId = id;
                document.getElementById("current-server-name").innerText = name;
                document.getElementById("msg-input").disabled = false;
                document.getElementById("msg-input").placeholder =
                    `Message ${name}`;
                document.getElementById("leave-btn").style.display = "block";

                const q = query(collection(db, "servers"));
                const snap = await getDocs(q);
                const sInfo = snap.docs.find((d) => d.id === id);

                if (sInfo) {
                    const sData = sInfo.data();
                    currentServerOwner = sData.owner;
                    document.getElementById("invite-display").innerText =
                        `CODE: ${sData.inviteCode}`;
                    const isOwner = sData.owner === currentUser.uid;
                    document.getElementById("delete-btn").style.display =
                        isOwner ? "block" : "none";
                }
                loadMessages(id);
                loadMembers(id);
            };

            window.leaveServer = async () => {
                if (!currentServerId || !confirm("Leave this server?")) return;
                const q = query(
                    collection(db, "members"),
                    where("serverId", "==", currentServerId),
                    where("userId", "==", currentUser.uid),
                );
                const snap = await getDocs(q);
                await Promise.all(
                    snap.docs.map((d) => deleteDoc(doc(db, "members", d.id))),
                );
                location.reload();
            };

            window.deleteServer = async () => {
                if (!currentServerId || !confirm("DELETE SERVER PERMANENTLY?"))
                    return;
                if (currentServerOwner !== currentUser.uid)
                    return alert("Unauthorized");
                await deleteDoc(doc(db, "servers", currentServerId));
                location.reload();
            };

            window.kickMember = async (targetUserId) => {
                if (currentServerOwner !== currentUser.uid) {
                    return alert("Only the server owner can kick members.");
                }

                if (targetUserId === currentUser.uid) {
                    return alert(
                        "You cannot kick yourself! Use 'Leave Server' instead.",
                    );
                }

                if (!confirm("Are you sure you want to kick this member?"))
                    return;

                try {
                    // Find the membership document for this user in this server
                    const q = query(
                        collection(db, "members"),
                        where("serverId", "==", currentServerId),
                        where("userId", "==", targetUserId),
                    );

                    const snap = await getDocs(q);

                    if (!snap.empty) {
                        // Delete the membership record
                        await deleteDoc(doc(db, "members", snap.docs[0].id));
                        alert("Member kicked successfully.");
                        // Refresh member list if you have a separate UI for it
                    } else {
                        alert("Member not found.");
                    }
                } catch (err) {
                    alert("Error kicking member: " + err.message);
                }
            };

            // --- MESSAGES & DELETION ---
            window.deleteMessage = async (messageId) => {
                if (!confirm("Delete this message?")) return;
                try {
                    await deleteDoc(doc(db, "messages", messageId));
                } catch (err) {
                    alert("Error deleting message: " + err.message);
                }
            };

            function loadMessages(serverId) {
                if (unsubMessages) unsubMessages();
                const q = query(
                    collection(db, "messages"),
                    where("serverId", "==", serverId),
                    orderBy("createdAt", "desc"),
                    limit(75),
                );

                unsubMessages = onSnapshot(q, (snap) => {
                    const list = document.getElementById("messages");
                    list.innerHTML = "";
                    const docs = [...snap.docs].reverse();
                    let lastMsg = null;

                    docs.forEach((doc) => {
                        const data = doc.data();
                        const messageId = doc.id;
                        const createdAt = data.createdAt?.toDate();
                        const time = createdAt
                            ? createdAt.toLocaleTimeString([], {
                                  hour: "2-digit",
                                  minute: "2-digit",
                              })
                            : "...";

                        const currentUserName =
                            currentUser.displayName ||
                            currentUser.email.split("@")[0];
                        const isSender = data.user === currentUserName;
                        const isOwner = currentUser.uid === currentServerOwner;

                        // Replace the old deleteBtn line with this one:
                        const deleteBtn =
                            isSender || isOwner
                                ? `<span class="delete-btn" onclick="deleteMessage('${messageId}')">❌</span>`
                                : "";

                        const li = document.createElement("li");
                        const isImg = (url) =>
                            typeof url === "string" &&
                            (url.startsWith("data:image") ||
                                /\.(jpg|jpeg|png|gif)$/i.test(url));
                        let content = isImg(data.text)
                            ? `<img src="${data.text}" style="max-width: 100%; max-height: 300px; border-radius: 8px; display: block; margin-top: 5px;">`
                            : data.text;

                        if (
                            lastMsg &&
                            lastMsg.user === data.user &&
                            createdAt - lastMsg.createdAt?.toDate() < 300000
                        ) {
                            li.className = "grouped";
                            li.innerHTML = `<div>${content} ${deleteBtn}</div>`;
                        } else {
                            li.innerHTML = `<span class="msg-user">${data.user}</span><span class="msg-time">${time}</span> ${deleteBtn}<br>${content}`;
                        }
                        list.appendChild(li);
                        lastMsg = data;
                    });
                    list.scrollTop = list.scrollHeight;
                });
            }

            document.getElementById("input-area").onsubmit = async (e) => {
                e.preventDefault();
                const val = document.getElementById("msg-input").value;
                if (!val || !currentServerId) return;
                document.getElementById("msg-input").value = "";
                await addDoc(collection(db, "messages"), {
                    text: val,
                    user:
                        auth.currentUser.displayName ||
                        auth.currentUser.email.split("@")[0],
                    serverId: currentServerId,
                    createdAt: serverTimestamp(),
                });
            };

            document.getElementById("file-chooser").onchange = async (e) => {
                const file = e.target.files[0];
                if (!file || !currentServerId) return;
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    await addDoc(collection(db, "messages"), {
                        text: reader.result,
                        user:
                            auth.currentUser.displayName ||
                            auth.currentUser.email.split("@")[0],
                        serverId: currentServerId,
                        createdAt: serverTimestamp(),
                    });
                };
            };
        </script>
    </body>
</html>
