<!DOCTYPE html>
<html>
<head>
  <title>Minimal Chat</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #messages { list-style-type: none; margin: 0; padding: 0; }
    #messages li { padding: 8px; margin-bottom: 5px; background: #eee; border-radius: 4px; }
    #form { position: fixed; bottom: 20px; display: flex; width: 90%; }
    input { flex-grow: 1; padding: 10px; }
    button { padding: 10px; }
  </style>
</head>
<body>

  <ul id="messages"></ul>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="Type a message..." /><button>Send</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value) {
        // Send the message to the server
        socket.emit('chat message', input.value);
        input.value = '';
      }
    });

    // Listen for messages coming FROM the server
    socket.on('chat message', (msg) => {
      const item = document.createElement('li');
      item.textContent = msg;
      messages.appendChild(item);
      window.scrollTo(0, document.body.scrollHeight);
    });
  </script>
</body>
</html>
